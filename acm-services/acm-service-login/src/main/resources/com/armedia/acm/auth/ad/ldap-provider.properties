#
# JNDI LDAP provider strings for ActiveDirectoryAbstractContextSource.
#
# These two values were compile-time literals in the Java source until the Java 17 migration. The
# context factory in particular was referenced as a class literal, which no longer compiles because
# the package that declares it is contained in - but not exported by - the java.naming module (JEP
# 396 strong encapsulation). JNDI only ever needs the fully qualified class NAME, so the values are
# held here as data instead. They are byte-identical to the literals they replace, so the runtime
# resolves exactly the same provider and the same connection-pooling property as before.
#
# Both values are read once, at class initialization, by LdapProviderProperties. Overriding the
# context factory no longer requires recompiling: point this key at any JNDI LDAP provider.
#

# Fully qualified name of the JNDI initial context factory used to create LDAP contexts.
ldap.provider.contextFactory=com.sun.jndi.ldap.LdapCtxFactory

# Name of the JNDI environment property that enables LDAP connection pooling.
ldap.provider.connectionPoolFlag=com.sun.jndi.ldap.connect.pool
