# JNDI provider configuration for ActiveDirectoryAbstractContextSource, in this package.
#
# ldap.provider.contextFactory     - fully qualified name of the JNDI initial context factory. It is resolved to a
#                                    Class at startup, so it must name a provider on the classpath, and it is passed
#                                    to JNDI as javax.naming.Context.INITIAL_CONTEXT_FACTORY.
# ldap.provider.connectionPoolFlag - name of the JNDI connection-pooling property, added to and removed from the
#                                    LDAP environment.
#
# LdapProviderProperties reads this resource class-relatively, exactly once, at class initialization: it must stay at
# com/armedia/acm/auth/ad/ on the classpath, and a missing file, a missing key or a blank value fails startup rather
# than the build. Values are used verbatim - java.util.Properties keeps whitespace at the end of a value, so trailing
# whitespace is rejected outright instead of being trimmed. Keep both values flush to the line ending.

ldap.provider.contextFactory=com.sun.jndi.ldap.LdapCtxFactory
ldap.provider.connectionPoolFlag=com.sun.jndi.ldap.connect.pool
