### ArkCase LDAP provider ###
#
# JNDI provider configuration data for the Active Directory / LDAP context source
# (com.armedia.acm.auth.ad.ActiveDirectoryAbstractContextSource).
#
# These entries are configuration VALUES, not type references. Both were compile-time
# literals in the Java source until the Java 17 migration: the initial context factory was
# referenced as a class literal, which no longer compiles because the package declaring it
# is contained in - but not exported by - the java.naming module (JEP 396 strong
# encapsulation). Loading the very same class by NAME is not subject to that encapsulation,
# so the name is externalized here and the class is resolved from it with Class.forName -
# which is what lets the context source keep publishing the identical default Class object
# it published on Java 8, and lets JNDI resolve the identical provider.
#
# The values are unchanged from the Java 8 base commit: JNDI resolves the same provider and
# uses the same connection-pooling property as before. Only the location of the strings
# changed, so there is no behavioural difference at runtime.
#
# LdapProviderProperties, in this same package, reads this resource exactly once at class
# initialization and fails fast if it is missing or a value is blank. It resolves the
# resource CLASS-RELATIVELY, which is why this file must remain at
# com/armedia/acm/auth/ad/ on the classpath - the path mirrors the Java package and is
# load-bearing. Renaming either the file or a key breaks startup, not the build.
#
# One deliberate side benefit: the provider is now redirectable without recompiling - point
# the context-factory key at any JNDI LDAP provider available on the classpath. It has to be
# ON that classpath, because the name is resolved to a class at startup; a name nothing can
# resolve is reported the same way a missing key is, naming this file and the key.
#
# ldap.provider.contextFactory     - fully qualified NAME of the JNDI initial context
#                                    factory. It is both loaded as the default
#                                    ActiveDirectoryAbstractContextSource.getContextFactory()
#                                    value and passed to JNDI as the value of
#                                    javax.naming.Context.INITIAL_CONTEXT_FACTORY
# ldap.provider.connectionPoolFlag - NAME of the JNDI connection-pooling property, added to
#                                    and removed from the LDAP environment
#
# Do NOT add trailing whitespace after either value. java.util.Properties trims whitespace
# around the '=' separator but preserves it at the end of a value, so a single stray space
# would otherwise yield an unresolvable factory name. LdapProviderProperties rejects such a
# value outright, naming this file and the offending key, rather than trimming it or letting
# it surface later as a JNDI ClassNotFoundException - but neither a green build nor a green
# test run will catch the typo for you, so keep the values flush to the line ending.

ldap.provider.contextFactory=com.sun.jndi.ldap.LdapCtxFactory
ldap.provider.connectionPoolFlag=com.sun.jndi.ldap.connect.pool
