#
# LDAP JNDI settings for com.armedia.acm.auth.ad.ActiveDirectoryAbstractContextSource.
#
# SINGLE SOURCE OF TRUTH
# This file is the single textual home for the two values in this repository. The Java class
# reads it for its defaults, and the "ldapJndiProperties" bean in
# spring/spring-library-user-login.xml loads this same file so the values are also exposed
# to any bean definition that prefers to wire them explicitly. Because both consumers read
# one file, the two cannot drift apart.
#
# FIDELITY - DO NOT ALTER
# Both values must be carried exactly as written. JNDI matches the initial context factory by
# exact class name and the connection pooling flag by exact property key; it recognises no
# variation, no abbreviation and no reassembled equivalent. Changing either value changes LDAP
# authentication behaviour.
#
# OVERRIDING
# Neither value needs to be set by a bean definition. The context source falls back to the
# values below, so a bean definition declared outside this repository - for example in the
# .arkcase configuration repository - needs no edit to keep working. A definition that does
# set contextFactory or connectionPoolFlag wins over these defaults, because ordinary Spring
# setter injection runs before afterPropertiesSet().
#
# SCOPE
# This file is deliberately a .properties file rather than a Spring bean file. Every Spring
# context location in the application globs *.xml only, so nothing loads this file as a bean
# definition and adding it introduces no new bean.
#

# Fully qualified class name of the JNDI initial context factory used to create LDAP contexts.
# Consumed as the javax.naming.Context.INITIAL_CONTEXT_FACTORY environment value, which JNDI
# resolves by name at run time.
ldap.jndi.initialContextFactory=com.sun.jndi.ldap.LdapCtxFactory

# JNDI environment property key that requests LDAP connection pooling. Placed in the
# environment with the value "true" when pooling is enabled and removed when it is not.
ldap.jndi.connectionPoolFlag=com.sun.jndi.ldap.connect.pool
