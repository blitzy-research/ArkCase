include:
  - local: '.gitlab-ci-release.yml'

variables:
  # Deploy server with specific Arkcase version
  # ============================================
  # DEPLOY_SERVER: true
  # ENVIRONMENT_NAME: Test FOIA
  # ENVIRONMENT_URL: https://foia-test.arkcase.org/
  # ARKCASE_VERSION: 3.3.6-RC1
  # INVENTORY: 47
  # TAGS: core,foia
  
  # Will have more variables to support extensions.
  # TAGS can be 'core', 'core,foia' depending of the environment
  # INVENTORY is the ID of the inventory in tower. Current inventory IDs are:
  #   44 - dev.core
  #   45 - dev.foia
  #   46 - test.core
  #   47 - test.foia
  #   58 - dev.privacy

  GIT_SSL_NO_VERIFY: "true"
  GIT_STRATEGY: clone

# CI runner image. This is the only runtime pin for the pipeline: the jobs
# included from .gitlab-ci-release.yml declare no image of their own.
#
# INFRASTRUCTURE PRECONDITION, external to this repository: the image must
# supply JDK 17, Node 20 LTS and npm 10. The reactor now compiles at release 17
# (the compiler contract is declared once, in the root pom.xml) and the frontend
# declares engines "node >=20.19.0 <21" / "npm >=10", so the superseded JDK 8 /
# Node 6-8 image can no longer build this branch. The tag is a new major: the
# base runtime changed incompatibly. The image Dockerfile lives OUTSIDE this
# repository and MUST be rebuilt on those runtimes before this pipeline passes.
#
# Network reach the image needs, measured rather than assumed: `npm ci` against
# the committed package-lock.json needs only outbound HTTPS to
# registry.npmjs.org and codeload.github.com. It records every GitHub
# dependency as git+ssh:// but resolves each one to a codeload tarball because
# the committish is a full 40-character SHA, so the install completes with no
# git binary and no SSH key present at all - verified by installing with git
# absent from PATH.
#
# REGENERATING the lockfile is the case that does need git: `npm install`
# clones each GitHub coordinate. An image used for that must ship an SSH deploy
# key, or the two `git config --global url.<https>.insteadOf <ssh>` rewrite
# rules mapping https://github.com/ over git+ssh://git@github.com/ and over
# ssh://git@github.com/. No pipeline job in this file or in
# .gitlab-ci-release.yml runs either command today; both invoke Maven only, and
# the deploy-time front-end install runs inside the deployed application.
image: arkcase-gitlab-ci:2.0.0

stages:
  - build
  - trigger
  - restart
  - release
  - deploy
  - start_security_scan
  - security_scan_results
  
.build_backend_snapshot:
  stage: build
  script:
    # build war file and deploy to Nexus Snapshots
    - echo '<settings>' > /root/.m2/settings.xml
    - echo '  <servers>' >> /root/.m2/settings.xml
    - echo '    <server>' >> /root/.m2/settings.xml
    - echo '      <id>arkcase.snapshot</id>' >> /root/.m2/settings.xml
    - echo '      <username>admin</username>' >> /root/.m2/settings.xml
    - echo "      <password>$MVN_PASSWORD</password>" >> /root/.m2/settings.xml
    - echo '    </server>' >> /root/.m2/settings.xml
    - echo '  </servers>' >> /root/.m2/settings.xml
    - echo '</settings>' >> /root/.m2/settings.xml
    - export MAVEN_OPTS="-Xmx2048M -Xss256M -XX:MetaspaceSize=2048M"
    - mvn -DskipITs -T 4 -B deploy "-DaltDeploymentRepository=arkcase.snapshot::default::$NEXUS_URL/repository/arkcase.snapshot/"
    - sshpass -e sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SFTP_USER@$SFTP_SERVER <<< $'put acm-standard-applications/arkcase/target/*.war /from-arkcase/arkcase.war' 
 
.build_artifact:
  stage: build
  script:
    - mvn -DskipITs clean install -Dmaven.wagon.http.ssl.insecure=true
  artifacts:
    paths:
      - target/*.war
    
.build_feature:
  extends: .build_artifact
  only:
    - feature/*

# Front-end gate for the Node 20 migration.
#
# The backend jobs above do NOT exercise the front-end toolchain: `mvn install` only
# packages src/main/webapp/resources into the WAR verbatim, and the Grunt pipeline is
# not run until deploy time, when AngularResourceCopier invokes npm and Grunt in the
# assembly folder. So without this job nothing in CI would notice a manifest that no
# longer installs, a lockfile that has drifted out of step with package.json, a Grunt
# pipeline that no longer produces its bundles, or bundles that no longer build - the
# first report would come from a deployment.
#
# The two commands are the migration's own acceptance criteria for the front end, in
# the order that fails soonest and cheapest:
#   npm ci      - installs strictly from the committed package-lock.json and fails if the
#                 lockfile and the manifest disagree. --ignore-scripts is REQUIRED, not a
#                 preference: one git-sourced asset repository has a `prepare` script that
#                 tries to build an ancient native module, which cannot compile on Node 20.
#                 It is safe because these are prebuilt asset repositories with checked-in
#                 distribution directories. It is passed on the command line rather than
#                 set in .npmrc precisely so that it does NOT also suppress the `prebuild`
#                 hook of `npm run build`, which is what writes the generated profiles module.
#   npm run build - the full Grunt `default` chain, which is the real proof the pipeline
#                 still emits its bundles on Node 20. Its `prebuild` hook writes the
#                 generated profiles module first, which is why --ignore-scripts is passed
#                 on the install command line rather than set in a project .npmrc: it must
#                 not also suppress that hook.
#
# The manifest declares engines "node >=20.19.0 <21" / "npm >=10". npm's default is
# engine-strict=false, so a runner outside that range prints EBADENGINE and continues;
# pinning the image to Node 20 is what actually holds the runtime, and that pin is the
# image precondition recorded at the top of this file.
.validate_frontend:
  stage: build
  script:
    - cd acm-standard-applications/arkcase/src/main/webapp/resources
    - node --version
    - npm --version
    - npm ci --ignore-scripts
    - npm run build

build_backend_develop:
  extends: .build_backend_snapshot
  only:
    - develop
  except:
    changes:
      #- .gitlab-ci.yaml

validate_frontend_develop:
  extends: .validate_frontend
  only:
    - develop

validate_frontend_feature:
  extends: .validate_frontend
  only:
    - feature/*

deploy_server:
  stage: deploy
  only:
    variables:
      - $DEPLOY_SERVER
  environment:
    name: $ENVIRONMENT_NAME
    url: $ENVIRONMENT_URL
  script:
    - 'curl -H "Content-Type: application/json" -X POST -s -u gitlabci:$GITLABCI_TOWER_PASSWORD -d ''{ "inventory": ''$INVENTORY'', "job_tags": "''$TAGS''" }'' -k $TOWER_URL/api/v2/job_templates/12/launch/'

deploy_backend_core_dev:
  stage: deploy
  only:
    - develop
  except:
    changes:
      - .gitlab-ci.yaml
  environment:
    name: Dev Core
  script:
    - 'curl -H "Content-Type: application/json" -X POST -s -u gitlabci:$GITLABCI_TOWER_PASSWORD -d ''{ "job_tags": "upgrade" }'' -k $APPDEV_TOWER_URL/api/v2/job_templates/12/launch/'

deploy_backend_foia_dev:
  stage: deploy
  only:
    - develop
  except:
    changes:
      - .gitlab-ci.yaml
  environment:
    name: Dev FOIA
  script:
    - 'curl -H "Content-Type: application/json" -X POST -s -u gitlabci:$GITLABCI_TOWER_PASSWORD -d ''{ "job_tags": "upgrade,foia" }'' -k $APPDEV_TOWER_URL/api/v2/job_templates/13/launch/'

.deploy_backend_privacy_dev:
  stage: deploy
  only:
    - develop
  except:
    changes:
      - .gitlab-ci.yaml
  environment:
    name: Dev Privacy
  script:
    # Dev Privacy repository ID on tower.armedia.com is 58
    - 'curl -H "Content-Type: application/json" -X POST -s -u gitlabci:$GITLABCI_TOWER_PASSWORD -d ''{ "inventory": 58, "job_tags": "core,privacy", "extra_vars": "{\"arkcase_version\": \"\", \"arkcase_configuration_version\":\"\", \"arkcase_config_server_version\":\"\", \"snowbound_arkcase_version\":\"\"}"}'' -k $TOWER_URL/api/v2/job_templates/129/launch/'

start_security_scan:
  stage: start_security_scan
  only:
    variables:
      - $START_SECURITY_SCAN
  script:
    - export ARKCASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -Dmaven.wagon.http.ssl.insecure=true)
    - echo $ARKCASE_VERSION
    - wget https://github.com/brian1917/vcodeHMAC-CLI/releases/download/v1.0/vcodeHMAC-CLI_linux
    - chmod 755 vcodeHMAC-CLI_linux
    - touch credentials
    - echo "[DEFAULT]" >> credendials
    - echo "veracode_api_key_id = $VERACODE_API_KEY" >> credentials
    - echo "veracode_api_key_secret = $VERACODE_API_SECRET" >> credentials
    # get arkcase.war version from Nexus
    - mvn -B dependency:get -DremoteRepositories=$NEXUS_URL/repository/$ARKCASE_REPOSITORY -DgroupId=com.armedia.acm.acm-standard-applications -DartifactId=arkcase -Dversion=$ARKCASE_VERSION -Dpackaging=war -Dtransitive=false -Dmaven.wagon.http.ssl.insecure=true
    - find ~/.m2/repository/com/armedia/acm -name _remote.repositories -exec rm -v {} \;
    - mvn -B dependency:copy -Dartifact=com.armedia.acm.acm-standard-applications:arkcase:$ARKCASE_VERSION:war -DoutputDirectory=. -Dmaven.wagon.http.ssl.insecure=true
    # Upload war
    - 'curl -k --compressed -H "Authorization: $(./vcodeHMAC-CLI_linux -credsFile credentials -url https://analysiscenter.veracode.com/api/5.0/uploadfile.do -method POST)" https://analysiscenter.veracode.com/api/5.0/uploadfile.do -F "app_id=529559" -F "file=@arkcase-$ARKCASE_VERSION.war"'
    # Begin static scan
    - 'curl -k --compressed -H "Authorization: $(./vcodeHMAC-CLI_linux -credsFile credentials -url https://analysiscenter.veracode.com/api/5.0/beginprescan.do -method POST)" https://analysiscenter.veracode.com/api/5.0/beginprescan.do -F "app_id=529559" -F "auto_scan=true"'
    # Start Software Composition Analysis
    - curl -sSL https://download.sourceclear.com/ci.sh | sh
    

security_scan_results:
  stage: security_scan_results
  only:
    variables:
      - $SECURITY_SCAN_RESULTS
  script:
    - wget https://github.com/brian1917/vcodeHMAC-CLI/releases/download/v1.0/vcodeHMAC-CLI_linux
    - chmod 755 vcodeHMAC-CLI_linux
    - touch credentials
    - echo "[DEFAULT]" >> credendials
    - echo "veracode_api_key_id = $VERACODE_API_KEY" >> credentials
    - echo "veracode_api_key_secret = $VERACODE_API_SECRET" >> credentials
    # Get scan info
    - 'BUILDINFO=$(curl -k --compressed -H "Authorization: $(./vcodeHMAC-CLI_linux -credsFile credentials -url https://analysiscenter.veracode.com/api/5.0/getbuildinfo.do -method POST)" https://analysiscenter.veracode.com/api/5.0/getbuildinfo.do -F "app_id=529559" 2>/dev/null)'
    - echo "BUILDINFO=$BUILDINFO"
    - BUILD_ID=$(grep -oPm1 "(?<=build_id=\")[^\"<]+" <<< "$BUILDINFO" | head -1)
    - echo "BUILD_ID=$BUILD_ID"
    # Get detailed report
    - 'DETAILED_REPORT=$(curl -k --compressed -H "Authorization: $(./vcodeHMAC-CLI_linux -credsFile credentials -url https://analysiscenter.veracode.com/api/5.0/detailedreport.do?build_id=$BUILD_ID -method GET)" https://analysiscenter.veracode.com/api/5.0/detailedreport.do?build_id=$BUILD_ID 2>/dev/null)'
    - SCAN_SCORE=$(grep -oPm1 "(?<=score=\")[^\"<]+" <<< "$DETAILED_REPORT" | head -1)
    - echo "SCAN_SCORE=$SCAN_SCORE"
    # Get detailed report as PDF
    - 'curl -k --compressed -H "Authorization: $(./vcodeHMAC-CLI_linux -credsFile credentials -url https://analysiscenter.veracode.com/api/4.0/detailedreportpdf.do?build_id=$BUILD_ID -method GET)" https://analysiscenter.veracode.com/api/4.0/detailedreportpdf.do?build_id=$BUILD_ID > scan-report.pdf' 
    # Send results via email
    - echo 'set from = "veracode-scan@armedia.com"' >> ~/.muttrc
    - echo 'set realname = "Veracode Scan"' >> ~/.muttrc
    - echo 'set smtp_url = "smtp://$SMTP_SERVER:25"' >> ~/.muttrc
    - echo 'set crypt_use_gpgme=no' >> ~/.muttrc
    - echo 'set ssl_starttls = no' >> ~/.muttrc
    - echo "Detailed scan result attached" | mutt -s "Veracode scan of Arkcase code on $(date +%m-%d-%y) finished with score $SCAN_SCORE" $EMAIL_ADDRESSES -a scan-report.pdf

    
.restart:
  stage: restart
  script:
    # Connect to environment
    # shutdown arkcase
    # startup arkcase
    # verify started
    - not blank job
  when: manual
