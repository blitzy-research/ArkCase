site_name: ArkCase
site_description: Case management and IT modernization platform
repo_url: https://github.com/Blitzy-Sandbox/blitzy-ArkCase
docs_dir: docs

plugins:
  - techdocs-core
  - mermaid2

nav:
  - Home: index.md
  - Developer Setup: setup.md
  - Module Overview: overview.md
  - Migration:
      - Dependency Change Inventory: migration/dependency-change-inventory.md
      - Add-Opens Exceptions: migration/add-opens-exceptions.md
      - Baseline Test Failures: migration/baseline-test-failures.md
      - Static Audit: migration/static-audit.md
      - Smoke Evidence: migration/smoke-evidence.md
      - Known Issues: migration/known-issues.md
      - Behavioral Decisions: migration/behavioral-decisions.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - fenced_code
